; SPDX-License-Identifier: GPL-3.0-only
; FoMni-1 on the original M5Stack Cardputer (StampS3, ESP32-S3FN8, 8 MB, no PSRAM), on the mvave-to-cardputer board
; layer (lib/mvave_cardputer, vendored with the kit's tools/sync_board.py). See ../CARDPUTER.md.
; Build only: install fomni-cardputer.bin into an M5Launcher slot. `pio run -t upload` would overwrite the Launcher.
; First run tools/gen.sh (X0X's generated headers in ../build/gen).

[platformio]
src_dir = src

[env:cardputer]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
lib_deps = m5stack/M5Cardputer
lib_extra_dirs = lib
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DOM_HOST=1
    -DOM_CARDPUTER=1
    -I../firmware/src
    -I../firmware/src/dsp
    -I../build/gen
    -ffp-contract=off
    -Wno-unused-function
    -Wno-unused-variable
    -Wno-unused-but-set-variable
; the engine as its own unit (as host/build_host.sh)
build_src_filter =
    +<*>
    +<../../firmware/src/dsp/omni.c>
extra_scripts =
    pre:tools/prefix_map.py
    post:tools/copy_bin.py
